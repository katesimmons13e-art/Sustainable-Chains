services:
  - type: web
    name: supply-chain-web
    env: node
    plan: starter
    buildCommand: npm install --build-from-source better-sqlite3
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: NPM_CONFIG_BUILD_FROM_SOURCE
        value: "true"
      - key: STRIPE_SECRET_KEY
      - key: STRIPE_WEBHOOK_SECRET
      - key: APP_BASE_URL
