services:
  - type: web
    name: supply-chain-web
    env: node
    plan: starter
    # Install all dependencies and compile native modules like better-sqlite3 from source
    buildCommand: npm install --build-from-source
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: NPM_CONFIG_BUILD_FROM_SOURCE
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
      - key: STRIPE_WEBHOOK_SECRET
      - key: APP_BASE_URL
