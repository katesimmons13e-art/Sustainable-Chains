<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
  <title id="title">Sustainable Chains logo</title>
  <desc id="desc">A recycle symbol around a soft blue globe with the text sustainable chains in the center.</desc>
  <defs>
    <linearGradient id="arrowFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea44f"/>
      <stop offset="100%" stop-color="#0b7c3b"/>
    </linearGradient>
    <linearGradient id="arrowHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#40c463" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1f9e50" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <circle cx="200" cy="200" r="186" fill="#dceefc" stroke="#b8d0e4" stroke-width="8"/>
  <path d="M255 86c26 12 44 31 52 52-25-6-49-3-70 9-23 13-43 37-56 68-14 33-37 53-66 64-26 10-53 10-82 0 12 28 38 52 72 65 49 18 104 7 143-22 42-31 70-86 58-138-9-37-30-68-51-98z"
        fill="#c6e6c7" opacity="0.6"/>

  <g id="arrow">
    <path d="M120 160 H210 V130 L300 200 L210 270 V240 H120 Z" fill="url(#arrowFill)" stroke="#0d5f2b" stroke-width="4" stroke-linejoin="round"/>
    <path d="M135 175 H212 V152 L278 200 L212 248 V225 H135 Z" fill="url(#arrowHighlight)" opacity="0.8"/>
  </g>

  <use href="#arrow" transform="rotate(0 200 200)"/>
  <use href="#arrow" transform="rotate(120 200 200)"/>
  <use href="#arrow" transform="rotate(240 200 200)"/>

  <text x="200" y="205" text-anchor="middle" font-size="30" fill="#1d3b2a" font-family="Georgia, 'Times New Roman', serif">sustainable</text>
  <text x="200" y="238" text-anchor="middle" font-size="30" fill="#1d3b2a" font-family="Georgia, 'Times New Roman', serif">chains</text>
</svg>
