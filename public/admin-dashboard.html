<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header>
    <div><strong>Admin Dashboard</strong></div>
    <nav>
      <a href="/">Public Site</a>
      <a href="#" id="admin-logout">Logout</a>
    </nav>
  </header>
  <div class="container">
    <div class="card">
      <h3>Platform Snapshot</h3>
      <div id="admin-overview" class="grid"></div>
    </div>

    <div class="card">
      <h3>Pending Brands</h3>
      <div id="pending-brands"></div>
    </div>

    <div class="card">
      <h3>Pending Supply Points</h3>
      <div id="pending-points"></div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
        <h3>Approved Brands</h3>
        <input id="admin-brand-search" type="search" placeholder="Search approved brands" style="min-width:220px; padding:10px; border:1px solid #e5e7eb; border-radius:8px;">
      </div>
      <div id="active-brands"></div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
        <h3>Invoices</h3>
        <select id="invoice-filter" style="padding:10px; border:1px solid #e5e7eb; border-radius:8px;">
          <option value="">All</option>
          <option value="DUE">Due</option>
          <option value="PAID">Paid</option>
        </select>
      </div>
      <div id="admin-invoices"></div>
    </div>

    <div class="card">
      <h3>Billing Jobs</h3>
      <button class="btn" id="run-monthly">Run monthly billing</button>
      <button class="btn secondary" id="run-annual">Run annual billing</button>
      <pre id="billing-output"></pre>
    </div>
  </div>
  <script src="/js/admin.js"></script>
</body>
</html>
